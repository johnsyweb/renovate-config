name: aube-lock

# Thin wrapper that pins jdx/renovate-config's aube-lock reusable workflow.
# Consumer repos call this workflow (not jdx's directly) so the pin lives in
# one place. See README.md.

on:
  workflow_call:
    inputs:
      post_update_task:
        description: Optional mise task that regenerates dependency-derived files
        required: false
        type: string
        default: ''
      post_update_paths:
        description: Newline-separated paths generated by post_update_task
        required: false
        type: string
        default: ''
    secrets:
      AUBE_LOCK_APP_ID:
        description: GitHub App ID used to push lockfile commits (optional)
        required: false
      AUBE_LOCK_APP_PRIVATE_KEY:
        description: GitHub App private key used to push lockfile commits (optional)
        required: false

jobs:
  aube-lock:
    uses: jdx/renovate-config/.github/workflows/aube-lock.yml@b326076309f570c2967d29a99742838c9ac0f383 # v1.0.1
    with:
      post_update_task: ${{ inputs.post_update_task }}
      post_update_paths: ${{ inputs.post_update_paths }}
    secrets:
      AUBE_LOCK_APP_ID: ${{ secrets.AUBE_LOCK_APP_ID }}
      AUBE_LOCK_APP_PRIVATE_KEY: ${{ secrets.AUBE_LOCK_APP_PRIVATE_KEY }}
